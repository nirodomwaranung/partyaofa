# Party AOFA — everything on one VPS: Postgres + API + Web behind Caddy.
# No Vercel, no Supabase.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   # first time only — seed the 10 games + sample players:
#   docker compose -f docker-compose.prod.yml exec api npx prisma db seed
#
# Requires a .env in this directory (copy from .env.example and fill values).

services:
  db:
    image: postgres:16-alpine
    container_name: aofa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aofa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aofa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-party_aofa}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aofa} -d ${POSTGRES_DB:-party_aofa}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: aofa-api
    env_file: .env
    environment:
      API_PORT: 3001
      NODE_ENV: production
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    # apply migrations, then start
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && node apps/api/dist/main.js"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aofa-web
    env_file: .env
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: aofa-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:

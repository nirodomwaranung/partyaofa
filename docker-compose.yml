services:
  db:
    image: postgres:16-alpine
    container_name: party-aofa-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aofa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aofa_secret}
      POSTGRES_DB: ${POSTGRES_DB:-party_aofa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aofa} -d ${POSTGRES_DB:-party_aofa}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
